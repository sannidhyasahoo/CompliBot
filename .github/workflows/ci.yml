name: CI Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    lint:
        name: ESLint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: Run ESLint
              run: npx eslint .

    format:
        name: Prettier
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: Check code formatting
              run: npx prettier --check "**/*.{js,jsx,ts,tsx,json,md}"

    quality-gate:
        name: Quality Gate
        runs-on: ubuntu-latest
        needs: [lint, format]

        steps:
            - name: All checks passed
              run: echo "✅ All quality checks passed!"
